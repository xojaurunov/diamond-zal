# Xotira chegarasi kompyuterga moslandi (avval -Xmx8G edi — RAM tang bo'lsa JVM qulaydi)
org.gradle.jvmargs=-Xmx1600m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# QR skaner (mobile_scanner): ML Kit Play Services orqali — APK ~600 KB o'sadi (ichiga qo'shilsa ~3 MB+)
dev.steenbakker.mobile_scanner.useUnbundled=true
